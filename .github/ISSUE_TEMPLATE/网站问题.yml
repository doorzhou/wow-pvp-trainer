name: 网站问题
description: 页面打不开、图标不显示、排版错乱、交互失效
title: "[问题] "
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: 哪个页面
      placeholder: 贴网址最好
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 出了什么问题
      description: 有截图最好
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 设备与浏览器
      placeholder: 比如 iPhone Safari / Windows Chrome
  - type: checkboxes
    id: check
    attributes:
      label: 先确认一下
      options:
        - label: 已经刷新过页面（Ctrl/Cmd + Shift + R）
